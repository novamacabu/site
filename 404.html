<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Página não encontrada | Nova Macabu</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D1E4A">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
@font-face{font-family:"Albert Sans";src:url("/assets/fonts/albert-sans-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--navy:#1D1E4A;--orange:#E86A38;--orange-hover:#F28357;--on-2:#B9C3D1;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;align-items:center;padding:32px 16px;background:var(--navy);color:#fff;font:1.0625rem/1.6 "Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{width:100%;max-width:720px;margin-inline:auto;display:grid;gap:22px;justify-items:start}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--on-2)}
.eyebrow::before{content:"";width:20px;height:2px;background:var(--orange)}
h1{margin:0;font-size:clamp(2.6rem,8vw,4.5rem);font-weight:300;line-height:1;letter-spacing:-.035em}
p{margin:0;color:var(--on-2);max-width:52ch}
a{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:4px;background:var(--orange);color:var(--navy);font-weight:600;text-decoration:none}
a:hover{background:var(--orange-hover)}
a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Erro 404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço que você procurou não existe ou mudou de lugar. Volte para a página inicial para ver rotas, tarifas e canais de atendimento.</p>
  <a href="/">Ir para a página inicial</a>
</main>
</body>
</html>
